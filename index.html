<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oracle Red Bull Racing</title>

    <link rel="stylesheet" href="style.css" />

    <!-- !    Bootstrap Code -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
    ></script>

    <!-- ! Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <nav class="navbar md:navbar-expand bg-1 fg-2 bg-navy sticky-top">
      <div class="container-fluid">
        <a class="navbar-brand fw-bold text-xl" href="#">
            <span>Red Bull</span>
            <span class="text-red"> Racing</span>
        </a>
        <button
          class="btn-icon navbar-toggler"
          type="button"
          data-bs-toggle="drawer"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
        >
          <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>
        <dialog
          class="drawer drawer-end"
          tabindex="-1"
          id="navbarNav"
        >
          <div class="drawer-header">
            <h5 class="drawer-title" id="navbarNavLabel">Menü</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="drawer"
            ></button>
          </div>
          <div class="drawer-body">
            <ul class="navbar-nav md:ms-auto">
              <li class="nav-item">
                <a class="nav-link active" href="#home">Anasayfa</a>
              </li>
               <li class="nav-item">
                <a class="nav-link" href="#stats">Takım</a>
              </li>
               <li class="nav-item">
                <a class="nav-link" href="#drivers">Pilotlar</a>
              </li>
               <li class="nav-item">
                <a class="nav-link" href="#car">Araç</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#schedule">Takvim</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#sponsors">Sponsorlar</a>
              </li>
            
            </ul>
          </div>
        </dialog>
      </div>
    </nav>

    <section id="home" class="hero-section d-flex align-items-center text-center text-md-center" >
        <div class="container position-relative z-1">
            <div class="row">
                <div class="col-lg-8">
                    <h1 class="fs-3xl fw-bolder text-uppercase">Oracle Red Bull RACING</h1>
                    <p class="lead text-light mb-5 fs-md">Hızın, inovasyonun ve şampiyonluk performansının sınırlarını zorluyoruz.</p>
                    <div class="d-flex flex-column sm:flex-row gap-3">
                        <a href="#drivers" class="btn btn-red btn-lg px-5 py-3 fw-bold text-uppercase rounded">Takımı Keşfet</a>
                        <a href="#schedule" class="btn btn-outline-light px-5 py-3 fw-bold text-uppercase rounded fg-white">Sezonu İncele</a>
                    </div>
                </div>
            </div>
        </div>
        <div class="hero-overlay">

        </div>
    </section>
  </body>
</html>
